<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- 예시 대표 이미지: '딸깍'으로 만든 빽빽한 슬라이드 → 다섯 단계 → 정돈된 슬라이드 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1FD"/><stop offset="1" stop-color="#F6F4EC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1F26" flood-opacity=".12"/></filter>
  </defs>
  <rect width="960" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="330" r="120" fill="#DCE7FB" opacity=".6"/>
  <circle cx="880" cy="60" r="100" fill="#FDEBE2" opacity=".7"/>

  <!-- 왼쪽: 한 번에 만든 슬라이드 -->
  <g transform="translate(70 92) rotate(-5)" filter="url(#sh)">
    <rect width="290" height="180" rx="12" fill="#fff"/>
    <rect x="18" y="16" width="190" height="12" rx="4" fill="#C9521F"/>
    <rect x="18" y="38" width="250" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="50" width="236" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="62" width="252" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="74" width="220" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="86" width="246" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="98" width="230" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="110" width="250" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="122" width="200" height="5" rx="2.5" fill="#C9C7BD"/>
    <rect x="18" y="138" width="80" height="28" rx="4" fill="#8BC34A" opacity=".7"/>
    <rect x="108" y="138" width="70" height="28" rx="14" fill="#F2C94C" opacity=".8"/>
    <rect x="188" y="138" width="84" height="28" rx="2" fill="#9B51E0" opacity=".45"/>
  </g>
  <!-- 딸깍 커서 -->
  <g transform="translate(300 232)">
    <g stroke="#C9521F" stroke-width="4" stroke-linecap="round">
      <line x1="-6" y1="-20" x2="-14" y2="-34"/><line x1="8" y1="-22" x2="12" y2="-38"/><line x1="-22" y1="-6" x2="-38" y2="-10"/>
    </g>
    <path d="M0 0 L0 46 L12 35 L21 55 L30 51 L21 31 L37 31 Z" fill="#1C1F26" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <rect x="22" y="-60" width="76" height="34" rx="17" fill="#C9521F"/>
    <text x="60" y="-37" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">딸깍!</text>
  </g>

  <!-- 가운데: 다섯 단계 -->
  <g transform="translate(410 200)">
    <path d="M0 0 H140" stroke="#B7CBF1" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="0" cy="0" r="15" fill="#fff" stroke="#2A63CC" stroke-width="2.5"/><text x="0" y="5" fill="#2A63CC">1</text>
      <circle cx="35" cy="0" r="15" fill="#fff" stroke="#2A63CC" stroke-width="2.5"/><text x="35" y="5" fill="#2A63CC">2</text>
      <circle cx="70" cy="0" r="15" fill="#fff" stroke="#2A63CC" stroke-width="2.5"/><text x="70" y="5" fill="#2A63CC">3</text>
      <circle cx="105" cy="0" r="15" fill="#fff" stroke="#2A63CC" stroke-width="2.5"/><text x="105" y="5" fill="#2A63CC">4</text>
      <circle cx="140" cy="0" r="15" fill="#2A63CC"/><text x="140" y="5" fill="#fff">5</text>
    </g>
    <text x="70" y="-34" text-anchor="middle" font-size="15" font-weight="700" fill="#5B6370">다섯 단계로</text>
    <path d="M160 0 h22 m-9 -9 l9 9 l-9 9" fill="none" stroke="#2A63CC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 오른쪽: 정돈된 슬라이드 묶음 -->
  <g transform="translate(616 96)">
    <rect x="36" y="-12" width="270" height="170" rx="12" fill="#fff" opacity=".6" filter="url(#sh)"/>
    <rect x="18" y="-2" width="270" height="170" rx="12" fill="#fff" opacity=".8"/>
    <g filter="url(#sh)">
      <rect width="270" height="170" rx="12" fill="#fff"/>
      <rect x="20" y="20" width="110" height="12" rx="4" fill="#2A63CC"/>
      <rect x="20" y="40" width="160" height="6" rx="3" fill="#C9C7BD"/>
      <rect x="20" y="64" width="90" height="84" rx="8" fill="#F2F5FB"/>
      <text x="65" y="112" text-anchor="middle" font-size="26" font-weight="900" fill="#2A63CC">5.2%</text>
      <rect x="126" y="118" width="24" height="30" rx="3" fill="#C9D6F2"/>
      <rect x="156" y="104" width="24" height="44" rx="3" fill="#C9D6F2"/>
      <rect x="186" y="90" width="24" height="58" rx="3" fill="#C9D6F2"/>
      <rect x="216" y="70" width="24" height="78" rx="3" fill="#2A63CC"/>
    </g>
    <g transform="translate(236 -18)">
      <circle r="22" fill="#2A63CC"/>
      <path d="M-9 0 l6 6 l12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="215" y="330" fill="#5B6370">한 번에 만든 PPT</text>
    <text x="751" y="330" fill="#2A63CC">규칙대로 만든 PPT</text>
  </g>
</svg>
